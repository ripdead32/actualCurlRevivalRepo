
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Curl</title>
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container page">
    <div class="card card-padding">
      <h1>Create an account</h1>
      <p>Join the Curl community.</p>

      <form id="register-form">
        <label for="username">Username</label>
        <input id="username" type="text" required minlength="3" maxlength="20">

        <label for="email">Email</label>
        <input id="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8">

        <button type="submit" id="register-button">Create account</button>
        <p id="register-message"></p>
      </form>
    </div>
  </main>

  <script type="module" src="/assets/js/navbar.js"></script>
  <script type="module" src="/assets/js/register.js"></script>
</body>
</html>
